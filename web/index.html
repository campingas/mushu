<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1117">
  <title>mushu</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lock" class="hidden">
    <div id="lock-name">mushu</div>
    <button id="lock-unlock">Unlock with Face ID</button>
  </div>
  <div id="safe-probe"></div>
  <div id="header">
    <span id="hostname"></span>
    <span id="chips"></span>
    <button id="settings-btn" title="Settings">&#9881;</button>
  </div>
  <div id="backdrop" class="hidden"></div>
  <div id="drawer" class="hidden">
    <div class="drawer-title">hosts</div>
    <div id="host-list"></div>
    <div class="drawer-title">workspaces</div>
    <div id="drawer-list"></div>
    <div class="drawer-title">agents</div>
    <div id="agent-list"></div>
    <div id="drawer-handle"></div>
  </div>
  <div id="status" class="hidden"></div>
  <div id="sheet" class="hidden">
    <div id="sheet-title"></div>
    <div class="sheet-row">
      <button data-act="keys" data-text="enter" class="approve">&#10003; Approve</button>
      <button data-act="keys" data-text="esc">Esc</button>
      <button data-act="keys" data-text="y">y</button>
      <button data-act="keys" data-text="n">n</button>
      <button data-act="keys" data-text="1">1</button>
      <button data-act="keys" data-text="2">2</button>
      <button data-act="keys" data-text="3">3</button>
    </div>
    <div class="sheet-row">
      <input id="sheet-prompt" type="text" placeholder="send a prompt…" autocomplete="off">
      <button id="sheet-send" data-act="prompt">Send</button>
    </div>
    <button id="sheet-close">close</button>
  </div>
  <div id="attention-card" class="hidden" role="dialog" aria-live="polite">
    <div id="attention-title"></div>
    <pre id="attention-context"></pre>
    <div id="attention-actions"></div>
    <button id="attention-close">close</button>
  </div>
  <div id="term"></div>
  <div id="toolbar">
    <button data-key="esc">Esc</button>
    <button data-key="tab">Tab</button>
    <button id="ctrl" class="mod">Ctrl</button>
    <button data-key="ctrl-c">^C</button>
    <button class="icon" title="Arrow controls unavailable" aria-label="Arrow controls unavailable" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path fill-rule="evenodd" d="M7.646.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 1.707V5.5a.5.5 0 0 1-1 0V1.707L6.354 2.854a.5.5 0 1 1-.708-.708zM8 10a.5.5 0 0 1 .5.5v3.793l1.146-1.147a.5.5 0 0 1 .708.708l-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 0 1 .708-.708L7.5 14.293V10.5A.5.5 0 0 1 8 10M.146 8.354a.5.5 0 0 1 0-.708l2-2a.5.5 0 1 1 .708.708L1.707 7.5H5.5a.5.5 0 0 1 0 1H1.707l1.147 1.146a.5.5 0 0 1-.708.708zM10 8a.5.5 0 0 1 .5-.5h3.793l-1.147-1.146a.5.5 0 0 1 .708-.708l2 2a.5.5 0 0 1 0 .708l-2 2a.5.5 0 0 1-.708-.708L14.293 8.5H10.5A.5.5 0 0 1 10 8"/>
      </svg>
    </button>
    <button id="mic" class="icon" title="Compose input" aria-label="Compose input">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0z"/>
        <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5"/>
      </svg>
    </button>
  </div>
  <div id="voicebar" class="hidden">
    <div id="voice-targets"></div>
    <div class="sheet-row">
      <textarea id="voice-input" rows="4" placeholder="type, paste, or dictate…" autocomplete="off" autocapitalize="off"></textarea>
      <button id="voice-rec" class="hidden">&#9210;</button>
    </div>
    <div class="sheet-row">
      <button id="voice-paste">Paste</button>
      <button id="voice-send" class="primary">Send</button>
      <button id="voice-send-enter" class="primary">Send &#9166;</button>
      <button id="voice-close">close</button>
    </div>
  </div>
  <div id="settings" class="hidden">
    <div id="settings-title">instances</div>
    <div id="instance-list"></div>
    <div class="sheet-row">
      <input id="inst-url" type="url" placeholder="https://host.tailnet.ts.net" autocomplete="off" autocapitalize="off">
    </div>
    <div class="sheet-row">
      <input id="inst-token" type="password" placeholder="instance token" autocomplete="off">
      <button id="inst-add">Add</button>
    </div>
    <button id="lock-toggle" class="hidden">enable face id lock</button>
    <button id="settings-close">close</button>
  </div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
