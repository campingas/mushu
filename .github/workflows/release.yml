name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: mushu-server-macos-aarch64
          # Cross-compiled from the arm64 runner: Apple's SDK carries both
          # slices, and macos-13 (the last Intel runner) has been retired.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: mushu-server-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: mushu-server-linux-x86_64
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: mushu-server-linux-aarch64
            musl: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Every target vendors OpenSSL. web-push reaches it through ece on all
      # platforms, not only Linux, so a default macOS build links an absolute
      # Homebrew dylib path that does not exist on a user's machine.
      - run: cargo build --release --locked --target ${{ matrix.target }} --features vendored-tls

      - name: Stage asset
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mushu-server" "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: staging
          merge-multiple: true
      - name: Collect assets
        run: |
          mkdir -p dist
          cp staging/mushu-server-* dist/
          cp scripts/mushuctl dist/mushuctl
          chmod 755 dist/*
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
