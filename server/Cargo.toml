[package]
name = "mushu-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Self-hosted PWA control surface for Herdr agent sessions"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
p256 = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
web-push = { version = "0.10", default-features = false, features = ["hyper-client"] }
mime_guess = "2"
portable-pty = "0.9"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
qrcode = { version = "0.14", default-features = false }
# Only present so `vendored-tls` can reach the openssl-sys that web-push pulls
# in through native-tls; nothing in the source uses it directly.
openssl = { version = "0.10", optional = true }

[features]
# Build OpenSSL from source and link it statically. Used for every released
# binary: web-push reaches OpenSSL through ece on all platforms, so a default
# macOS build links an absolute Homebrew dylib path and a default Linux build
# needs a matching system libssl. Local builds keep using the system library.
vendored-tls = ["dep:openssl", "openssl/vendored"]

[[bin]]
name = "mushu-server"
path = "src/main.rs"
